<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TaskFlow Pro</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="user-display">Welcome!</span>
                <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 800px;">
        <!-- Add Task Form -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Add New Task</h5>
                <form id="task-form" class="row g-3">
                    <div class="col-md-6">
                        <input type="text" id="task-title" class="form-control" placeholder="Task Title" required>
                    </div>
                    <div class="col-md-3">
                        <select id="task-priority" class="form-select">
                            <option value="Low">Low Priority</option>
                            <option value="Medium" selected>Medium Priority</option>
                            <option value="High">High Priority</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">+ Add Task</button>
                    </div>
                    <div class="col-12">
                        <textarea id="task-desc" class="form-control" rows="2" placeholder="Task Description (Optional)"></textarea>
                    </div>
                </form>
            </div>
        </div>

        <!-- Task List -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Your Tasks</h5>
                    <select id="filter-status" class="form-select form-select-sm" style="width: auto;">
                        <option value="">All Tasks</option>
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div id="task-list"></div>
            </div>
        </div>
    </div>

    <!-- External JavaScript Files -->
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
